<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f3640">
  <title>Pigrafi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <!-- Google Consent Mode v2: di default nega cookie pubblicitari; si attiva solo dopo "Accetta" -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('consent', 'default', {
      ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied'
    });
    if (localStorage.getItem('pigrafi:ads-consent') === 'accepted') {
      gtag('consent', 'update', { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted' });
    }
  </script>
  <!-- Google AdSense (snippet di verifica) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2414957329781059" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <h1>Pigrafi</h1>
    <div class="controls">
      <label>
        Città
        <select id="city"></select>
      </label>
      <label>
        Cognome del defunto
        <input id="surname" type="search" placeholder="es. ROSSI" autocomplete="off">
      </label>
    </div>
    <p id="status" class="status"></p>
  </header>

  <main id="list" aria-live="polite"></main>

  <div id="consent" class="consent" hidden>
    <p>Usiamo cookie per mostrare annunci pubblicitari (Google AdSense). Puoi accettare o rifiutare. <a href="privacy.html">Privacy</a></p>
    <div class="consent-actions">
      <button id="consent-reject" type="button">Rifiuta</button>
      <button id="consent-accept" type="button">Accetta</button>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
