name: Aggiornamento pigrafi

on:
  schedule:
    # 23:00 UTC = mezzanotte in Italia (ora solare). In estate è 01:00 locali.
    # 03:00 UTC = 04:00 in Italia (ora solare); in estate sono le 05:00
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scraper/scrape.mjs
        env:
          SOURCES_URL: ${{ secrets.SOURCES_URL }}
          SOURCES_TOKEN: ${{ secrets.SOURCES_TOKEN }}
      - name: Salva i dati aggiornati
        run: |
          git config user.name "pigrafi-bot"
          git config user.email "pigrafi-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aggiornamento pigrafi $(date -u +%F)"
          git push
